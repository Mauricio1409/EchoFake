# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - venv_volume:/app/.venv
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: .env

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
      - venv_volume:/app/.venv
      - media_volume:/app/media
    depends_on:
      - redis
    env_file: .env

volumes:
  media_volume:
  venv_volume: