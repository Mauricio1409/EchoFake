{% load static %}<header class="top">
  <div class="top__inner">
    <a class="brand" href="{% url 'home' %}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M3 12h2m3-6v12m4-16v20m4-14v8m4-5v2"/>
      </svg>
      <span>Echo<b>Fake</b></span>
    </a>
    <nav class="primary-nav" aria-label="Principal">
      <a class="primary-nav__link{% if active == 'home' %} is-active{% endif %}" href="{% url 'home' %}">Inicio</a>
      <a class="primary-nav__link{% if active == 'create' %} is-active{% endif %}" href="{% url 'create' %}">Generar</a>
      <a class="primary-nav__link{% if active == 'list' %} is-active{% endif %}" href="{% url 'subject-list' %}">Casos</a>
      <a class="primary-nav__link{% if active == 'how' %} is-active{% endif %}" href="{% url 'how-it-works' %}">Cómo funciona</a>
      <a class="primary-nav__link{% if active == 'attackers' %} is-active{% endif %}" href="{% url 'how-attackers' %}">Cómo atacan</a>
      {% if user.is_authenticated %}
        <button type="button" class="primary-nav__link primary-nav__link--btn" id="logout-btn">Salir</button>
      {% else %}
        <a class="primary-nav__link" href="{% url 'login-page' %}">Ingresar</a>
      {% endif %}
    </nav>
  </div>
</header>
{% if user.is_authenticated %}
<script>
  document.getElementById("logout-btn").addEventListener("click", async () => {
    try {
      await fetch("/api/auth/logout/", { method: "POST" });
    } finally {
      window.location.href = "{% url 'login-page' %}";
    }
  });
</script>
{% endif %}
